<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Body Footer Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Website Logo</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="content">
        <h2>Main Body Content</h2>
        <p>This is where your primary content goes. Because we are using Flexbox, even if there is only one line of text here, the footer will stay firmly at the bottom of the page!</p>
    </main>

    <footer>
        <p>&copy; 2026 Your Company. All rights reserved.</p>
    </footer>

</body>
</html>
